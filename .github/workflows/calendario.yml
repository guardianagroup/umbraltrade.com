# Cada hora: calendario económico de la semana para los avisos de noticias de la web (data/calendar.json)
name: Calendario económico
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendario
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/calendar.js data/calendar.json
      - name: Guardar si ha cambiado
        run: |
          if git diff --quiet -- data/calendar.json && git ls-files --error-unmatch data/calendar.json >/dev/null 2>&1; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json
          git commit -m "Calendario económico al día"
          git push
