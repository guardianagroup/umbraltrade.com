# La cuenta del algoritmo: cada 15 minutos ejecuta tools/cuenta.js y guarda el estado en la rama «cuenta» (no reconstruye la web).
# Cada cambio queda en el historial público de esa rama, con su hora.
name: Cuenta del algoritmo
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuenta
  cancel-in-progress: false
jobs:
  cuenta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rama de datos
        run: |
          git fetch --depth=1 origin cuenta
          git worktree add datos FETCH_HEAD
      - name: Ejecutar la cuenta
        run: node tools/cuenta.js datos/cuenta.json
      - name: Guardar
        run: |
          cd datos
          git config user.name "umbral-cuenta"
          git config user.email "umbral-cuenta@users.noreply.github.com"
          git add cuenta.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -q -m "Cuenta $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin HEAD:cuenta && exit 0; sleep 5; done
          exit 1
