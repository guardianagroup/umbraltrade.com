# La racha de 1 minuto (idea de Francisco, 16-11-2026): operaciones Sube/Baja de 1 minuto en 16 índices sintéticos de Deriv, 50 € a todo y reinvertir,
# a ver cuántas seguidas salen. Dinero ficticio; ticks y pagos reales de la API pública de Deriv (no usa ninguna cuenta).
# Un bucle de unas 5 h 45 min (tools/racha.sh) que al acabar lanza la tarea siguiente. Estado en la rama «cuenta»: racha.json y racha-ops.jsonl.
name: Racha
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: racha
  cancel-in-progress: false
jobs:
  racha:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rama de datos
        run: |
          git config --global user.name "umbral-motor"
          git config --global user.email "umbral-motor@users.noreply.github.com"
          git fetch --depth=1 origin cuenta
          git worktree add datos FETCH_HEAD
      - name: Racha
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/racha.sh
