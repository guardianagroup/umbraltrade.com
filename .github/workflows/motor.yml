# El motor de Umbral: pone al día el calendario económico de la web cada hora (data/calendar.json, en main).
# Es un bucle de unas 5 h 40 min (tools/motor.sh) que al acabar lanza la tarea siguiente; la tarea programada es solo una red por si la cadena se corta.
name: Motor
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */4 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: motor
  cancel-in-progress: false
jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bucle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "umbral-motor"
          git config --global user.email "umbral-motor@users.noreply.github.com"
          bash tools/motor.sh
